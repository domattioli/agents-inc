name: tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  unittest:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run workerbee skill tests
        run: python -m unittest discover -s skills/workerbee/tests -p 'test_*.py'
